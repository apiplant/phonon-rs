    <script>
      // Set the theme before first paint so the page never flashes the wrong one.

        try {
          var stored = localStorage.getItem("phonon-rs-theme");
          var light =

            (!stored && window.matchMedia("(prefers-color-scheme: light)").matches);
          if (light) document.documentElement.classList.add("light");
          document.documentElement.style.colorScheme = light ? "light" : "dark";
        } catch (_) {
          /* private mode: dark is the default anyway */
        }
