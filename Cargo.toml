[package]
name = "phonon"
description = "Phonon-2 speech-to-text CLI (candle, CPU or CUDA)"
license = "Apache-2.0"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
candle-core = "0.11"
candle-nn = "0.11"
clap = { version = "4.6.7", features = ["derive", "env"], optional = true }
cpal = { version = "0.18.2", optional = true }
ctrlc = { version = "3.5.2", optional = true }
env_logger = { version = "0.11.11", optional = true }
evdev = { version = "0.13", optional = true }
half = "2.7.1"
log = "0.4.34"
num_cpus = "1.17.0"
rayon = "1.12.0"
realfft = "3.5.0"
rubato = "5.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
symphonia = { version = "0.6.1", features = ["all"] }
tar = "0.4.46"
zstd = "0.14.0"

# talk to PipeWire / PulseAudio instead of opening ALSA hardware that the sound server already holds
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["pulseaudio"], optional = true }

[features]
default = ["onnx", "dictate"]
# microphone capture (cpal, ctrlc): `phonon::mic`
mic = ["dep:cpal", "dep:ctrlc"]
# the `phonon` command-line binary (clap, env_logger) and clap's ValueEnum on the engine option enums
cli = ["mic", "dep:clap", "dep:env_logger"]
# the `phonon-dictate` daemon (evdev hotkeys and uinput typing). Disable default features to use phonon as an inference-only library
dictate = ["cli", "dep:evdev"]
# ONNX Runtime backend through transcribe-rs
onnx = []
# CUDA for both backends (candle kernels + cuBLAS; ONNX Runtime CUDA execution provider)
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[[bin]]
name = "phonon"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "phonon-dictate"
path = "src/bin/phonon-dictate.rs"
required-features = ["dictate"]

# `cargo run` without --release: optimise dependencies (candle's CPU kernels are unusably slow at opt-level 0)
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
