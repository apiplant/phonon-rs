[package]
name = "phonon"
description = "Phonon-2 speech-to-text CLI (candle, CPU or CUDA)"
license = "Apache-2.0"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
candle-core = "0.11"
candle-nn = "0.11"
clap = { version = "4.6.7", features = ["derive", "env"] }
cpal = "0.18.2"
ctrlc = "3.5.2"
env_logger = "0.11.11"
evdev = "0.13"
half = "2.7.1"
log = "0.4.34"
num_cpus = "1.17.0"
rayon = "1.12.0"
realfft = "3.5.0"
rubato = "5.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
symphonia = { version = "0.6.1", features = ["all"] }
tar = "0.4.46"
zstd = "0.14.0"

# talk to PipeWire / PulseAudio instead of opening ALSA hardware that the sound server already holds
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["pulseaudio"] }

[features]
default = ["onnx"]
# ONNX Runtime backend through transcribe-rs
onnx = []
# CUDA for both backends (candle kernels + cuBLAS; ONNX Runtime CUDA execution provider)
cuda = ["candle-core/cuda", "candle-nn/cuda"]

# `cargo run` without --release: optimise dependencies (candle's CPU kernels are unusably slow at opt-level 0)
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
